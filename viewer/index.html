<!DOCTYPE html>
<!-- 🥑 Slideshow player for saved camera/annotation slides. by aoxilus -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D OBJ Viewer Show — slides 🥑</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        #viewer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #object-container {
            width: 1000px;
            height: 700px;
            background-color: #888888;
            border: 2px solid #333;
            position: relative;
            margin-bottom: 20px;
        }

        #description {
            margin-top: 10px;
            text-align: center;
            font-size: 18px;
            color: #333;
        }

        #carousel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .carousel-btn {
            cursor: pointer;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin: 0 10px;
        }

        .carousel-btn:hover {
            background-color: #555;
        }

        #carousel-slides {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px;
            border-radius: 5px;
            background-color: #fff;
            border: 2px solid #333;
        }

        .carousel-slide {
            flex-shrink: 0;
            padding: 10px;
            border: 2px solid #333;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
            text-align: center;
            white-space: normal;
            display: inline-block;
        }

        .carousel-slide:hover {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <!-- 3D Viewer -->
        <div id="object-container"></div>

        <!-- Carousel Slider -->
        <div id="carousel-container">
            <button id="prev-slide" class="carousel-btn">Previous</button>
            <div id="carousel-slides"></div>
            <button id="next-slide" class="carousel-btn">Next</button>
        </div>

        <!-- Slide Description -->
        <div id="description"></div>
    </div>

    <script src="viewer.js" type="module"></script>
</body>
</html>
