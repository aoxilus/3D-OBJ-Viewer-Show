<!DOCTYPE html>
<!-- 🥑 3D OBJ Viewer Show — main editor: pick OBJ, materials, annotations, store slides. by aoxilus -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D OBJ Viewer Show 🥑</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }

        #file-select-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        #object-container {
            width: 1000px;
            height: 700px;
            background-color: #888888;
            margin: 0 auto; /* Center the viewer */
            border: 2px solid #333;
            position: relative;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        button {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            width: 200px;
        }

        #camera-info {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>3D Object Viewer</h1>
    </header>

    <div id="file-select-container">
        <select id="file-select">
            <option value="">Select a file</option>
        </select>
    </div>

    <div id="object-container"></div>

    <div id="controls">
        <button id="plain-view">Plain</button>
        <button id="wireframe-view">Wireframe</button>
        <button id="with-texture-view">With Texture</button>
        <input type="text" id="slide-name" placeholder="Enter Slide Name">
        <button id="store-slide">Store Slide</button>
        <button id="toggle-annotations">Toggle Annotations</button>
        <button id="delete-arrows">Delete All Arrows</button>
    </div>

    <div id="camera-info">Camera Position: <span id="camera-pos">0, 0, 0</span></div>

    <script type="module" src="loader.js"></script>
</body>
</html>
